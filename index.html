<title>Porsche 991 Carrera T Swiss tracker</title>
<style>
  :root{
    --yellow:#f5f200;
    --yellow-dark:#c1b900;
    --ink:#16181c;
    --muted:#696969;
    --line:#eaeaea;
    --line2:#d7d7d7;
    --bg:#f6f6f4;
    --card:#ffffff;
    --red:#fd351a;
    --green:#2c6415;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}

  /* ---- top bar ---- */
  header.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
  .brand{font-weight:900;font-size:21px;letter-spacing:-.4px;cursor:pointer;color:var(--ink)}
  .brand-accent{color:var(--yellow-dark);font-weight:800}

  /* ---- results header ---- */
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  .crumbs{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .crumbs b{color:var(--ink)}
  .results-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .results-head h1{font-size:23px;letter-spacing:-.3px}
  .results-head .count{color:var(--muted);font-size:14px;font-weight:600}
  .subtitle{color:var(--muted);font-size:13.5px;margin:4px 0 20px;max-width:760px;line-height:1.5}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .toolbar .count{font-size:15px;font-weight:800;color:var(--ink)}
  .sortbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .sortbar select{font-family:inherit;font-size:13px;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}

  /* ---- card list ---- */
  .list{display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:340px 1fr;cursor:pointer;transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 8px 28px rgba(0,0,0,.10);transform:translateY(-2px)}
  .card .ph{position:relative;background:#e9e9ec;aspect-ratio:4/3;overflow:hidden}
  .card .ph img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:10px;left:10px;background:var(--yellow);color:#000;font-weight:800;font-size:11px;padding:4px 9px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase}
  .badge.top{background:var(--ink);color:var(--yellow)}
  .imgcount{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:flex;gap:5px;align-items:center}
  .datechip{position:absolute;top:10px;right:10px;background:#fff;color:var(--ink);font-weight:800;font-size:11.5px;padding:4px 9px;border-radius:6px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);border-left:3px solid var(--yellow)}
  .datechip svg{width:13px;height:13px;color:var(--muted)}
  .datechip b{font-weight:800}
  .ddate{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--yellow);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700}
  .ddate svg{width:16px;height:16px;color:var(--muted)}
  .ddate span{color:var(--muted);font-weight:600}
  .dupflag{display:inline-flex;align-items:center;gap:6px;margin-top:10px;align-self:flex-start;background:#fff4d6;color:#7a5c00;border:1px solid #f0d98a;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:800}
  .dupflag svg{width:14px;height:14px}
  .dupbox{background:#fff8e6;border:1px solid #f0d98a;border-radius:14px;padding:18px 20px;margin-top:22px}
  .dupbox h2{font-size:15px;font-weight:800;margin-bottom:6px;color:#7a5c00;display:flex;align-items:center;gap:8px}
  .dupbox h2 svg{width:18px;height:18px}
  .dupbox p{font-size:13px;color:#8a6d1a;margin-bottom:12px}
  .duplink{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;font-family:inherit}
  .duplink:hover{border-color:var(--yellow-dark);box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .duplink img{width:64px;height:46px;object-fit:cover;border-radius:6px;flex:none;background:#e9e9ec}
  .duplink .t{font-weight:700;font-size:13.5px}
  .duplink .s{font-size:12px;color:var(--muted);margin-top:2px}
  .duplink .go{margin-left:auto;color:var(--muted)}.duplink .go svg{width:18px;height:18px}
  .card .body{padding:16px 18px;display:flex;flex-direction:column;min-width:0}
  .card .title{font-size:18px;font-weight:800;letter-spacing:-.2px}
  .card .desc{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .price{font-size:21px;font-weight:900;margin-top:12px}
  .price .old{font-size:13px;font-weight:600;color:var(--muted);text-decoration:line-through;margin-left:8px}
  .specs{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:14px}
  .spec{display:flex;align-items:center;gap:7px;font-size:13px;color:#33373d;font-weight:600}
  .spec svg{width:17px;height:17px;color:var(--muted);flex:none}
  .seller{margin-top:auto;padding-top:14px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .seller .dot{width:3px;height:3px;border-radius:50%;background:var(--line2)}
  @media(max-width:680px){.card{grid-template-columns:1fr}.card .ph{aspect-ratio:16/10}}

  /* ---- detail ---- */
  #detail{display:none}
  body.detail #results{display:none}
  body.detail #detail{display:block}
  .back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:#33373d;cursor:pointer;margin-bottom:16px}
  .back svg{width:18px;height:18px}
  .dgrid{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start}
  @media(max-width:920px){.dgrid{grid-template-columns:1fr}}
  .gallery{background:#0d0e10;border-radius:16px;overflow:hidden}
  .gallery .main{position:relative;background:#0d0e10;display:flex;align-items:center;justify-content:center;min-height:300px}
  .gallery .main img{width:100%;max-height:64vh;object-fit:contain;display:block}
  .gnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .gnav:hover{background:rgba(0,0,0,.8)}
  .gnav.prev{left:14px}.gnav.next{right:14px}
  .gnav svg{width:22px;height:22px}
  .gcount{position:absolute;bottom:12px;right:14px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
  .thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#0d0e10}
  .thumbs img{width:84px;height:60px;object-fit:cover;border-radius:6px;opacity:.55;cursor:pointer;flex:none;border:2px solid transparent}
  .thumbs img.active{opacity:1;border-color:var(--yellow)}

  .dtitle{font-size:27px;font-weight:900;letter-spacing:-.4px;line-height:1.15}
  .dsub{color:var(--muted);font-size:14px;margin-top:6px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
  .pricebox .big{font-size:30px;font-weight:900}
  .pricebox .lease{font-size:13px;color:var(--muted);margin-top:6px}
  .btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;font-weight:800;font-size:14.5px;border:none;cursor:pointer;margin-top:14px}
  .btn.primary{background:var(--yellow);color:#000}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line2);margin-top:10px}
  .sellercard{margin-top:18px}
  .sellercard .nm{font-weight:800;font-size:15px}
  .sellercard .addr{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}
  .sellercard .tag{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;color:var(--green);background:#eaf5e3;padding:3px 9px;border-radius:6px}

  .section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:22px}
  .section h2{font-size:17px;font-weight:800;margin-bottom:16px}
  .keygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
  .keyitem{display:flex;gap:11px;align-items:flex-start}
  .keyitem svg{width:21px;height:21px;color:var(--muted);flex:none;margin-top:2px}
  .keyitem .k{font-size:12px;color:var(--muted)}
  .keyitem .v{font-size:14.5px;font-weight:700;margin-top:1px}
  .equip{columns:2;column-gap:30px}
  @media(max-width:620px){.equip{columns:1}}
  .equip li{list-style:none;font-size:14px;padding:7px 0 7px 24px;position:relative;break-inside:avoid;color:#23262b;border-bottom:1px solid var(--line)}
  .equip li:before{content:"";position:absolute;left:0;top:12px;width:12px;height:7px;border-left:2px solid var(--yellow-dark);border-bottom:2px solid var(--yellow-dark);transform:rotate(-45deg)}
  .desc-txt{font-size:14.5px;line-height:1.7;color:#23262b;white-space:pre-line}
  .modelnote{font-size:13px;color:var(--muted);line-height:1.7;margin-top:4px}
  footer{max-width:1180px;margin:0 auto;padding:30px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
</style>
</head>

<script>
/* ---------- ICONS ---------- */
const I = {
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  fuel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22h12V4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M15 8h2a2 2 0 0 1 2 2v6a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.5L18 6"/><path d="M6 6h6"/></svg>',
  road:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22 8 2M20 22 16 2M12 6v2M12 12v2M12 18v2"/></svg>',
  power:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>',
  trans:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><path d="M6 8.4v7.2M18 8.4V13a3 3 0 0 1-3 3H6"/></svg>',
  cons:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3s6 5.5 6 10a6 6 0 0 1-12 0c0-4.5 6-10 6-10z"/></svg>',
  color:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.7 0 2-1.3 1-2.3-.8-.8-.3-2 .8-2h1.7a3.5 3.5 0 0 0 3.5-3.5C20 7 16.4 3 12 3z"/></svg>',
  body:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l2-5h11l3 3h2a1 1 0 0 1 1 1v3h-3M6 13H3v3h2"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="17" cy="16.5" r="1.8"/></svg>',
  chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>',
  chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  copies:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>'
};
function dupsOf(c){ const k=c.dupKey||c.listing; return k ? CARS.filter(x=>(x.dupKey||x.listing)===k) : [c]; }

/* ---------- IMAGE URL HELPER (autoscout24 CDN, with format fallback) ---------- */
function pfx(listingId){ return String(parseInt(listingId,10)%1000); } // CDN folder = id % 1000
function imgUrl(listingId, imageId, ext, w){
  return `https://listing-images.autoscout24.ch/${pfx(listingId)}/${listingId}/${imageId}.${ext}?w=${w||1024}&q=90`;
}
// image source: Drive file (gid) if present, else AutoScout24 CDN
function srcOf(im, id, w){
  return im.gid ? `images/${im.gid}.jpg` : imgUrl(id, im.id, im.ext, w);
}
function onerrAttr(im, id){
  return im.gid ? `onerror="driveFallback(this,'${im.gid}')"` : `onerror="imgFallback(this,'${id}','${im.id}','${im.ext}')"`;
}
const PLACEHOLDER='data:image/svg+xml;utf8,'+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1e22"/><stop offset="1" stop-color="#34373d"/></linearGradient></defs><rect width="800" height="600" fill="url(%23g)"/><text x="50%" y="48%" fill="%23f5f200" font-family="Arial" font-size="46" font-weight="bold" text-anchor="middle">PORSCHE</text><text x="50%" y="57%" fill="%23ffffff" font-family="Arial" font-size="26" text-anchor="middle" opacity="0.8">911 Carrera T</text></svg>`);
function imgFallback(el, listingId, imageId, ext){
  if(!el.dataset.try){ el.dataset.try='1';
    el.src=`https://listing-images.autoscout24.ch/listing/${pfx(listingId)}/${listingId}/${imageId}.${ext}?w=1024&q=90`;
  } else { el.onerror=null; el.src=PLACEHOLDER; }
}
function driveFallback(el, gid){
  if(el.dataset.t2!=='1'){ el.dataset.t2='1'; el.src=`https://lh3.googleusercontent.com/d/${gid}=w1024`; }
  else { el.onerror=null; el.src=PLACEHOLDER; }
}

/* ---------- DATA (source : bloc JSON ci-dessus = fichier 911-carrera-t-data.json) ---------- */
const CARS = JSON.parse(document.getElementById('cars-data').textContent);
const SAVED = {}; CARS.forEach(c => { SAVED[c.id] = c.saved || null; });
const MOIS=['janv.','f\u00e9vr.','mars','avr.','mai','juin','juil.','ao\u00fbt','sept.','oct.','nov.','d\u00e9c.'];
function fmtDate(id){ const d=SAVED[id]; if(!d) return null; const [y,m,j]=d.split('-'); return parseInt(j)+' '+MOIS[parseInt(m)-1]+' '+y; }

const MODEL_NOTE = `La 911 Carrera T (« T » pour Touring) reprend l'esprit de la 911 T de 1967 : « moins, c'est plus ». Moteur 6 cylindres à plat biturbo 3.0 L de 370 ch, boîte manuelle 7 rapports (ou PDK), 0 à 100 km/h en 4,5 s. Allègement : isolation réduite, lunette et vitres latérales arrière en verre léger, sièges arrière supprimés. Châssis sport PASM rabaissé de 20 mm, Porsche Torque Vectoring, jantes Carrera S 20" couleur Titane, échappement sport à double sortie centrale.`;

const fmtPrice = p => p ? "CHF " + p.toLocaleString('fr-CH').replace(/ |,/g,"'") + ".–" : "Prix sur demande";

/* ---------- RENDER LIST ---------- */
function specRow(c){
  const items=[];
  if(c.year) items.push([I.cal,c.year]);
  if(c.fuel) items.push([I.fuel,c.fuel]);
  if(c.km) items.push([I.road,c.km]);
  if(c.power) items.push([I.power,c.power]);
  if(c.trans) items.push([I.trans,c.trans]);
  if(c.cons) items.push([I.cons,c.cons]);
  return items.map(([ic,v])=>`<div class="spec">${ic}<span>${v}</span></div>`).join('');
}
function cardImg(c,w){
  if(!c.img) return `<img src="${PLACEHOLDER}" alt="${c.title}">`;
  const n=(c.gallery?c.gallery.length:1);
  return `<span class="imgcount">${I.cam}${n}</span>
      <img src="${srcOf(c.img,c.id,w)}" alt="${c.title}" loading="lazy" ${onerrAttr(c.img,c.id)}>`;
}
function cardHTML(c){
  return `<article class="card" onclick="openCar('${c.id}')">
    <div class="ph">
      <span class="badge ${c.badgeTop?'top':''}">${c.badge||'911'}</span>
      ${fmtDate(c.id)?`<span class="datechip">${I.cal}<b>${fmtDate(c.id)}</b></span>`:''}
      ${cardImg(c,700)}
    </div>
    <div class="body">
      <div class="title">${c.title}</div>
      <div class="desc">${c.short}</div>
      <div class="price">${fmtPrice(c.price)}</div>
      <div class="specs">${specRow(c)}</div>
      ${dupsOf(c).length>1?`<span class="dupflag">${I.copies} Vue ${dupsOf(c).length} fois dans la collection</span>`:''}
      <div class="seller">${c.seller}<span class="dot"></span>${c.place}</div>
    </div>
  </article>`;
}
function renderList(){
  let arr=[...CARS];
  const s=document.getElementById('sort').value;
  const kmN=v=>{const n=parseInt(String(v||'').replace(/[^0-9]/g,''));return isNaN(n)?Infinity:n;};
  if(s==='price-asc') arr.sort((a,b)=>(a.price||1e9)-(b.price||1e9));
  if(s==='price-desc') arr.sort((a,b)=>(b.price||0)-(a.price||0));
  if(s==='km-asc') arr.sort((a,b)=>kmN(a.km)-kmN(b.km));
  if(s==='km-desc') arr.sort((a,b)=>(kmN(b.km)===Infinity?-1:kmN(b.km))-(kmN(a.km)===Infinity?-1:kmN(a.km)));
  if(s==='date-desc') arr.sort((a,b)=>(SAVED[b.id]||'0').localeCompare(SAVED[a.id]||'0'));
  if(s==='date-asc') arr.sort((a,b)=>(SAVED[a.id]||'9').localeCompare(SAVED[b.id]||'9'));
  document.getElementById('list').innerHTML=arr.map(cardHTML).join('');
  const uniq=new Set(CARS.map(c=>c.dupKey||c.listing||c.id)).size;
  document.getElementById('count').textContent=CARS.length+' annonces · '+uniq+' voitures uniques';
}

/* ---------- RENDER DETAIL ---------- */
let gIndex=0, gImgs=[], gCar=null;
function keyItem(ic,k,v){return v?`<div class="keyitem">${ic}<div><div class="k">${k}</div><div class="v">${v}</div></div></div>`:'';}
function gShow(i){
  if(!gCar||!gImgs.length) return;
  gIndex=(i+gImgs.length)%gImgs.length;
  const im=gImgs[gIndex];
  const main=document.getElementById('gmain');
  main.dataset.try=''; main.dataset.t2='';
  main.onerror=function(){ im.gid?driveFallback(this,im.gid):imgFallback(this,gCar.id,im.id,im.ext); };
  main.src=srcOf(im,gCar.id,1280);
  document.getElementById('gcount').textContent=(gIndex+1)+' / '+gImgs.length;
  document.querySelectorAll('.thumbs img').forEach((t,k)=>t.classList.toggle('active',k===gIndex));
}
function gPrev(){gShow(gIndex-1)} function gNext(){gShow(gIndex+1)}
function renderDetail(c){
  gCar=c; gImgs=c.gallery||(c.img?[c.img]:[]); gIndex=0;
  const equip=c.equip.map(e=>`<li>${e}</li>`).join('');
  const grp=dupsOf(c), others=grp.filter(x=>x.id!==c.id);
  const dupHTML = grp.length>1 ? `<div class="dupbox"><h2>${I.copies} Cette voiture apparaît ${grp.length} fois dans la collection</h2><p>Même annonce AutoScout24 (réf. ${c.listing||c.id}) enregistrée plusieurs fois. Autres occurrences :</p>${others.slice().sort((a,b)=>(SAVED[a.id]||'').localeCompare(SAVED[b.id]||'')).map(o=>`<button class="duplink" onclick="openCar('${o.id}')"><img src="${srcOf(o.img,o.id,170)}" ${onerrAttr(o.img,o.id)}><div><div class="t">${fmtDate(o.id)||'—'} — ${fmtPrice(o.price)}</div><div class="s">${o.seller} · ${o.place} · ${(o.gallery||[o.img]).filter(Boolean).length} photos</div></div><span class="go">${I.chevR}</span></button>`).join('')}</div>` : '';
  let galleryHTML;
  if(!gImgs.length){
    galleryHTML=`<div class="gallery"><div class="main"><img src="${PLACEHOLDER}" alt="${c.title}"></div></div>`;
  } else {
    const multi=gImgs.length>1;
    const thumbs=multi?`<div class="thumbs">${gImgs.map((im,k)=>`<img class="${k===0?'active':''}" src="${srcOf(im,c.id,170)}" onclick="gShow(${k})" ${onerrAttr(im,c.id)}>`).join('')}</div>`:'';
    galleryHTML=`<div class="gallery">
        <div class="main">
          <img id="gmain" src="${srcOf(gImgs[0],c.id,1280)}" alt="${c.title}" ${onerrAttr(gImgs[0],c.id)}>
          ${multi?`<button class="gnav prev" onclick="gPrev()">${I.chevL}</button><button class="gnav next" onclick="gNext()">${I.chevR}</button>`:''}
          <div class="gcount" id="gcount">1 / ${gImgs.length}</div>
        </div>
        ${thumbs}
      </div>`;
  }
  document.getElementById('detail').innerHTML=`
   <div class="back" onclick="goHome()">${I.chevL} Retour aux annonces</div>
   <div class="dgrid">
     <div>${galleryHTML}</div>
     <aside>
       <div class="dtitle">${c.title}</div>
       <div class="dsub">${c.variant||''}</div>
       ${fmtDate(c.id)?`<div class="ddate">${I.cal}<span>Annonce enregistrée le</span>&nbsp;${fmtDate(c.id)}</div>`:''}
       <div class="panel pricebox" style="margin-top:18px">
         <div class="big">${fmtPrice(c.price)}</div>
         <div class="lease">Comparer les offres de financement · assurances</div>
         <button class="btn primary">Contacter le vendeur</button>
         <button class="btn ghost">Demander un essai</button>
         <div class="sellercard">
           <div class="nm">${c.seller}</div>
           <div class="addr">${c.place}</div>
           <span class="tag">Annonce enregistrée</span>
         </div>
       </div>
     </aside>
   </div>

   ${dupHTML}
   <div class="section">
     <h2>Caractéristiques principales</h2>
     <div class="keygrid">
       ${keyItem(I.cal,'Mise en circulation',c.year||'—')}
       ${keyItem(I.road,'Kilométrage',c.km||'—')}
       ${keyItem(I.power,'Puissance',c.power)}
       ${keyItem(I.trans,'Transmission',c.trans)}
       ${keyItem(I.fuel,'Carburant',c.fuel)}
       ${keyItem(I.cons,'Consommation',c.cons||'—')}
       ${keyItem(I.color,'Couleur',c.color||'—')}
       ${keyItem(I.body,'Carrosserie',c.bodytype||'Coupé')}
     </div>
   </div>

   <div class="section">
     <h2>Équipements &amp; options</h2>
     <ul class="equip">${equip}</ul>
   </div>

   <div class="section">
     <h2>Description du vendeur</h2>
     <div class="desc-txt">${c.desc}</div>
   </div>

   <div class="section">
     <h2>À propos de la 911 Carrera T</h2>
     <div class="modelnote">${MODEL_NOTE}</div>
   </div>`;
}

/* ---------- ROUTING ---------- */
function openCar(id){ location.hash='#/car/'+id; }
function goHome(){ location.hash=''; }
function route(){
  const m=location.hash.match(/#\/car\/(.+)/);
  if(m){
    const c=CARS.find(x=>x.id===m[1]);
    if(c){ renderDetail(c); document.body.classList.add('detail'); window.scrollTo(0,0); return; }
  }
  document.body.classList.remove('detail');
}
window.addEventListener('hashchange',route);
renderList(); route();
</script>
